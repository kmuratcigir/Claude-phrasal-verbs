<title>Prepositions & Collocations</title>
<style>
  /* Layout: single centred column (780px) like the vocab quiz; mode switch, then cards. Light-only by design, matching the vocab page. */
  :root{--hm0:#f1f2f8;--q1:#e6e2fe;--q2:#c4b9fb;--q3:#9a88f6;--q4:#7460ee;--q5:#4f3bc9;--s1:#fde7e5;--s2:#f8bfb9;--s3:#f08f86;--s4:#dc5f55;--s5:#ac3b33;--bg:#f6f7fb;--card:#ffffff;--border:#e7e9f2;--text:#232842;--head:#191d33;--text-dim:#6b7290;--text-faint:#9498b0;--accent:#6d5cf6;--accent-soft:#efecff;--accent-line:#e2ddff;--accent-ink:#544a9e;--mint:#1fb383;--mint-soft:#e4f8f0;--mint-ink:#0e7c58;--coral:#f2554c;--coral-soft:#fdeceb;--coral-ink:#c23930;--gold:#e69a1f;--gold-soft:#fdf3e2;--gold-ink:#a3730e;--gold-line:#f3dba3;--sky:#3b82c4;--sky-soft:#e6f0fa;color-scheme:light;}
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(circle at 10% -5%,#efeaff 0%,transparent 45%),radial-gradient(circle at 95% 10%,#e2f9f0 0%,transparent 40%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;min-height:100vh;padding:32px 16px 60px;}
  .wrap{max-width:780px;margin:0 auto;}
  .top{text-align:center;margin-bottom:18px;}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px;}
  .top h1{font-size:27px;font-weight:800;margin:0 0 6px;letter-spacing:-0.01em;color:var(--head);text-wrap:balance;}
  .top p{font-size:13.5px;color:var(--text-dim);margin:0;}
  .mode-switch{display:flex;justify-content:center;gap:8px;margin:18px 0 20px;}
  .mode-btn{font:inherit;font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:99px;border:1px solid var(--border);background:var(--card);color:var(--text-dim);cursor:pointer;}
  .mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .banner{font-size:12.5px;background:var(--gold-soft);border:1px solid var(--gold-line);color:var(--gold-ink);padding:9px 13px;border-radius:12px;margin-bottom:14px;line-height:1.5;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px 24px 20px;box-shadow:0 12px 34px rgba(90,80,180,0.07);margin-bottom:16px;}
  .ex-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .ex-head h2{font-size:17.5px;font-weight:800;margin:0;color:var(--head);}
  .type-pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);background:var(--bg);border:1px solid var(--border);padding:4px 9px;border-radius:99px;white-space:nowrap;}
  .note{font-size:12.5px;background:var(--accent-soft);border:1px solid var(--accent-line);padding:10px 14px;border-radius:12px;margin-bottom:16px;color:var(--accent-ink);line-height:1.5;}
  .btn{font-family:inherit;font-size:13px;font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text-dim);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn:disabled{opacity:.4;cursor:default;}
  .btn:focus-visible,.mini-btn:focus-visible,.mc-option:focus-visible,.mode-btn:focus-visible,.blank-input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .start-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .start-box{border:1px solid var(--border);border-radius:14px;padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:10px;min-width:0;}
  .start-box h3{margin:0;font-size:14.5px;color:var(--head);}
  .start-box p{margin:0;font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .size-input{width:64px;font:inherit;font-size:14px;font-weight:700;padding:6px 8px;border:1px solid var(--border);border-radius:8px;color:var(--accent);background:var(--card);}
  .lbl{font-size:12px;color:var(--text-faint);}
  .check-lbl{font-size:12.5px;color:var(--text-dim);display:flex;align-items:center;gap:6px;cursor:pointer;}
  .preview{font-size:12px;color:var(--text-dim);line-height:1.6;}
  .preview b{color:var(--head);}
  .picker{margin-top:14px;display:none;}
  .picker.open{display:block;}
  .pick-group h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);margin:14px 0 6px;}
  .pick-list{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;}
  .pick-item{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:4px 0;cursor:pointer;min-width:0;}
  .pick-item span.l{flex:1;min-width:0;}
  .pick-item .meta{font-size:11px;color:var(--text-faint);white-space:nowrap;}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px;}
  .progress-track{height:7px;background:var(--card);border-radius:99px;margin:0 0 16px;overflow:hidden;border:1px solid var(--border);}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--mint));border-radius:99px;transition:width .3s ease;}
  .item{padding:14px 16px;margin:0 0 14px;border:1px solid var(--border);border-radius:14px;background:#fbfbfe;box-shadow:0 2px 6px rgba(90,80,180,0.04);}
  .item:last-of-type{margin-bottom:0;}
  .item.ok{border-left:4px solid var(--mint);}
  .item.bad{border-left:4px solid var(--coral);}
  @media (max-width:600px){.item{padding:12px;}}
  .item-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
  .chip{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;border:1px solid var(--border);color:var(--text-faint);background:var(--bg);white-space:nowrap;}
  .chip.yours{color:var(--accent-ink);background:var(--accent-soft);border-color:var(--accent-line);}
  .chip.newc{color:var(--sky);background:var(--sky-soft);border-color:#cfe0f3;}
  .chip.tr{color:var(--gold-ink);background:var(--gold-soft);border-color:var(--gold-line);white-space:normal;}
  .reason{font-size:11px;color:var(--text-faint);}
  .item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .prompt{font-size:14.5px;line-height:1.7;flex:1;min-width:0;}
  .num{color:var(--accent);font-weight:800;margin-right:6px;}
  .btn-row{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .mini-btn{font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:8px;cursor:pointer;border:1px solid transparent;white-space:nowrap;font-family:inherit;}
  .mini-btn.hint{color:var(--gold);background:var(--gold-soft);border-color:var(--gold-line);}
  .mini-btn.check{color:#fff;background:var(--accent);}
  .mini-btn.zero{color:var(--accent-ink);background:var(--accent-soft);border-color:var(--accent-line);}
  .mini-btn.self{font-size:11px;padding:5px 9px;border:1px solid var(--border);background:var(--bg);color:var(--text-dim);}
  .mini-btn:disabled{opacity:.4;cursor:default;}
  .hint-text{font-size:12.5px;color:var(--gold-ink);margin-top:8px;background:var(--gold-soft);padding:8px 12px;border-radius:9px;line-height:1.5;}
  .hint-text div+div{margin-top:3px;}
  .blank-input{font-family:inherit;border:none;border-bottom:2px solid var(--border);background:transparent;font-size:14.5px;padding:2px 6px;width:110px;max-width:100%;color:var(--accent);font-weight:700;margin:0 2px;}
  .blank-input:focus{outline:none;border-bottom-color:var(--accent);}
  .blank-input.wide{width:100%;margin-top:8px;}
  .mc-options{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .mc-option{font:inherit;text-align:left;font-size:13.5px;padding:9px 13px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;background:var(--bg);color:var(--text);display:flex;align-items:center;gap:8px;}
  .mc-option:hover{border-color:var(--accent);}
  .mc-option.selected{border-color:var(--accent);background:var(--accent-soft);}
  .mc-option.dimmed{opacity:.35;text-decoration:line-through;pointer-events:none;}
  .mc-option.correct{background:var(--mint-soft);border-color:var(--mint);color:var(--mint-ink);font-weight:700;}
  .mc-option.incorrect{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-ink);}
  .mc-icon{font-size:12px;width:16px;text-align:center;flex-shrink:0;}
  .feedback{font-size:12.5px;margin-top:8px;padding:9px 12px;border-radius:9px;line-height:1.55;}
  .feedback.correct{color:var(--mint-ink);background:var(--mint-soft);}
  .feedback.incorrect{color:var(--coral-ink);background:var(--coral-soft);}
  .feedback .ans{font-weight:800;}
  .why{font-size:12.5px;color:var(--text-dim);margin-top:6px;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:9px;line-height:1.55;display:flex;flex-direction:column;gap:6px;}
  .why b{color:var(--head);}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .stat{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--bg);text-align:center;}
  .stat .v{white-space:nowrap;font-size:clamp(16px,4.5vw,22px);font-weight:800;color:var(--head);font-variant-numeric:tabular-nums;}
  .stat .k{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;}
  .quad{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;}
  .quad .axis{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);display:flex;align-items:center;justify-content:center;text-align:center;}
  .quad .axis.side{writing-mode:vertical-rl;transform:rotate(180deg);}
  .cell{border-radius:12px;padding:12px;min-height:90px;border:1px solid var(--border);display:flex;flex-direction:column;gap:6px;min-width:0;}
  .cell h5{margin:0;font-size:12px;color:var(--head);}
  .cell p{margin:0;font-size:11.5px;color:var(--text-dim);line-height:1.4;}
  .cell .chips{display:flex;flex-wrap:wrap;gap:4px;}
  .cell.c1{background:var(--gold-soft);border-color:var(--gold-line);}
  .cell.c2{background:var(--coral-soft);border-color:#f6c9c5;}
  .cell.c3{background:var(--mint-soft);border-color:#bfe9d8;}
  .cell.c4{background:var(--bg);}
  .pchip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--card);border:1px solid var(--border);color:var(--text);}
  .pchip.quiet{border-style:dashed;color:var(--text-dim);}
  .tbl-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle;}
  td.n{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text-dim);}
  .pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;}
  .pill.rising{background:var(--coral-soft);color:var(--coral-ink);}
  .pill.steady{background:var(--gold-soft);color:var(--gold-ink);}
  .pill.fading{background:var(--mint-soft);color:var(--mint-ink);}
  .pill.quiet{background:var(--bg);color:var(--text-faint);border:1px dashed var(--border);}
  .pill.strong{background:var(--mint-soft);color:var(--mint-ink);}
  .pill.weak{background:var(--coral-soft);color:var(--coral-ink);}
  .pill.none{background:var(--bg);color:var(--text-faint);}
  .spark{display:block;}
  .legend{font-size:11.5px;color:var(--text-faint);margin-top:10px;line-height:1.5;}
  .pair-line{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:14.5px;line-height:1.9;}
  .pair-line .tag{font-size:11px;font-weight:800;color:var(--accent);width:16px;}
  .mini-btn.zin{font-size:11px;padding:3px 7px;color:var(--accent-ink);background:var(--accent-soft);border-color:var(--accent-line);}
  .mix-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:12.5px;color:var(--text-dim);}
  .mix-row select{font:inherit;font-size:12.5px;font-weight:700;color:var(--accent);padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--card);}
  .hm-ctrl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .hm-ctrl .sep{width:1px;height:20px;background:var(--border);margin:0 4px;}
  .seg{font:inherit;font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;border:1px solid var(--border);background:var(--card);color:var(--text-dim);cursor:pointer;}
  .seg.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line);}
  .hm-wrap{overflow-x:auto;padding-bottom:4px;}
  .hm{display:grid;gap:2px;align-items:center;font-size:11.5px;}
  .hm .rl{padding-right:10px;white-space:nowrap;color:var(--text);font-weight:600;min-width:0;max-width:230px;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;z-index:1;background:var(--card);align-self:stretch;display:flex;align-items:center;}
  .hm .rl.sub{font-weight:500;color:var(--text-dim);padding-left:14px;}
  .hm .rl button{font:inherit;font-size:10.5px;color:var(--accent);background:none;border:none;cursor:pointer;padding:0 0 0 6px;font-weight:700;}
  .hm .ch{font-size:9.5px;letter-spacing:-.02em;color:var(--text-faint);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .hm .c{height:24px;border-radius:4px;background:var(--hm0);cursor:default;outline-offset:1px;}
  .hm .c.none{background:transparent;border:1px dashed var(--border);}
  .hm .c:hover,.hm .c:focus-visible{outline:2px solid var(--head);}
  .chips-cloud{display:flex;flex-wrap:wrap;gap:8px;}
  .pchip2{font:inherit;display:inline-flex;align-items:baseline;gap:7px;padding:7px 12px;border-radius:10px;border:none;color:#fff;font-size:14px;font-weight:800;cursor:default;line-height:1.2;}
  .pchip2 .pct{font-weight:500;font-variant-numeric:tabular-nums;opacity:.95;}
  .pchip2.nodata{background:var(--hm0)!important;color:var(--text-faint);border:1px dashed var(--border);font-weight:700;}
  .pchip2.quiet{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);}
  .pchip2:focus-visible{outline:2px solid var(--head);outline-offset:2px;}
  .hm-sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800;margin:6px 0 10px;}
  .hm-sec.second{margin-top:20px;}
  .scale-bar{height:10px;width:160px;border-radius:99px;background:linear-gradient(90deg,#a8402f,#a87100 50%,#6f8a12 75%,#2f8f4e);}
  .hm-legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--text-faint);}
  .hm-legend .sw{width:22px;height:12px;border-radius:3px;}
  .hm-legend .sw.none{border:1px dashed var(--border);}
  .hm-tip{white-space:pre-line;position:fixed;z-index:20;pointer-events:none;background:var(--head);color:#fff;font-size:11.5px;line-height:1.45;padding:7px 9px;border-radius:8px;max-width:240px;box-shadow:0 6px 18px rgba(0,0,0,.18);}
  .quizbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.95);border-top:1px solid var(--border);box-shadow:0 -6px 20px rgba(90,80,180,0.08);}
  .quizbar .in{max-width:780px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .quizbar .count{font-size:12.5px;font-weight:700;color:var(--text-dim);font-variant-numeric:tabular-nums;}
  .quizbar .acts{display:flex;gap:8px;}
  .quizbar .btn{padding:8px 14px;font-size:12.5px;}
  body.has-bar{padding-bottom:96px;}
  .qnote{font-size:11.5px;color:var(--text-faint);line-height:1.5;margin:2px 0 4px;}
  .fam-head{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--border);}
  .fam-head h4{margin:0;font-size:12.5px;color:var(--head);flex:1;min-width:0;}
  .fam-head .meta{font-size:11px;color:var(--text-faint);white-space:nowrap;}
  .fam-body{display:none;padding:0 0 8px 24px;}
  .fam-body.open{display:block;}
  tr.fam td{background:var(--bg);font-weight:700;color:var(--head);}
  tr.fam td.n{font-weight:600;}
  tr.sub td:first-child{padding-left:22px;}
  .toggle{font:inherit;font-size:11px;font-weight:700;color:var(--accent);background:none;border:none;cursor:pointer;padding:2px 0;white-space:nowrap;}
  @media (prefers-reduced-motion:reduce){.progress-fill{transition:none;}}
  @media (max-width:600px){.card{padding:18px 16px 16px;}.start-grid{grid-template-columns:1fr;}.pick-list{grid-template-columns:1fr;}.item-top{flex-direction:column;}.btn-row{justify-content:flex-start;}.quad{grid-template-columns:1fr;}.quad .axis{display:none;}}
</style>
<div class="wrap">
  <div class="top">
    <div class="eyebrow">Murat's English Journey</div>
    <h1>Prepositions &amp; Collocations</h1>
    <p id="subtitle">Your own Turkish-shaped prepositions and verb + noun collocations, from the Fluency Ledger</p>
  </div>
  <div class="mode-switch">
    <button class="mode-btn active" id="modePractice">Practice</button>
    <button class="mode-btn" id="modeChallenge">Challenge</button>
    <button class="mode-btn" id="modeProgress">Progress</button>
  </div>
  <div id="banner" class="banner" hidden></div>
  <div id="practiceView"></div>
  <div id="progressView" hidden></div>
</div>
<script>
/*__STATS__*/
/*__BANK__*/
const INTERVALS=[0,1,3,7,14,30];
const FAMILIES=[
 {id:'zero',label:'No preposition (∅)',keys:['no_prep_verbs','these_days','mention_discuss','seek_chase','against','ask_sb_q']},
 {id:'of',label:'of / out of',keys:['of_not_for','sense_of','remind_of','accused_of','leave_out_of']},
 {id:'about',label:'about',keys:['confused_about','same_about']},
 {id:'to',label:'to / on to',keys:['add_to','move_on_to','dedicate_to','limit_to','key_to','specific_to','superior_to','get_used_to','been_to']},
 {id:'in',label:'in / into',keys:['include_in','rooted_in','no_point_in','invest_in','paste_into','in_form']},
 {id:'on',label:'on',keys:['on_my_list','on_device','on_trip_leave','basis','short_on_time','congratulate_on','scene','insist_on']},
 {id:'time',label:'at / on / in for time',keys:['dates_times','begin_lastmin','weekends','over_time','time_duration']},
 {id:'at',label:'at (skill, speed)',keys:['good_at','pace_at']},
 {id:'for',label:'for',keys:['for_me','swap_for','save_for','responsible_for','wait_for']},
 {id:'with',label:'with / as',keys:['same_as','angry_with','help_with','resonate_with','come_across_as']},
 {id:'forms',label:'Word forms (-ing, by, from)',keys:['worth_ing','by_using','struggle_to','different_from']},
 {id:'vn',label:'Verb + noun collocations',keys:['vn_decision','vn_break','vn_analysis','vn_score','have_a_talk','do_practice','lift_mood','throw_question','put_add','vn_call','vn_meeting']}];
let hmSet='prep', hmMetric='combined', hmOpen=new Set();
let openFams=new Set(), openPick=new Set(), advSel=new Set(), advPickOpen=false, sessions={core:null,adv:null};
const ZERO='∅';
const AS_OF=SESSIONS[SESSIONS.length-1].d;
const P={}; BANK.forEach(p=>{P[p.k]=p; p.items.forEach((it,i)=>it.i=i); let pi=0; p.items.forEach(it=>{if(it.c){it.h=(PAIR_HINTS_2[p.k]&&PAIR_HINTS_2[p.k][pi])||PAIR_HINTS[p.k]||'';pi++;}});});
const isCore=p=>p.sec!=='adv';
let db=null, memState={}, prefs={size:20,vn:false,mix:0.5}, session=null, view='practice', manualOpen=false, manualSel=new Set();
const writeChains={};

// ---------- helpers ----------
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return todayStr(d);}
function fmtDate(s){if(!s)return '';const [y,m,d]=s.split('-');return d+'.'+m;}
const CONTR=[[/\blet's\b/g,'let us'],[/\bit's\b/g,'it is'],[/\bthere's\b/g,'there is'],[/\bthat's\b/g,'that is'],[/\bi'm\b/g,'i am'],[/\bi've\b/g,'i have'],[/\bcan't\b/g,'cannot'],[/\bwon't\b/g,'will not'],[/(\w)n't\b/g,'$1 not']];
function norm(s){s=(s||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim().replace(/[.!?]+$/,'').trim();CONTR.forEach(([a,b])=>s=s.replace(a,b));return s;}
function answers(it){return it.a.split('|').map(a=>a===ZERO?'':a);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

// ---------- speaking stats ----------
const N_S=SESSIONS.length, RECENT=5;
function speech(k){return speechArr(HITS[k]||new Array(N_S).fill(0));}
function famHits(f){const h=new Array(N_S).fill(0);f.keys.forEach(k=>(HITS[k]||[]).forEach((c,i)=>h[i]+=c));return h;}
function speechArr(h){
  const rate=h.map((c,i)=>c/SESSIONS[i].w*1000);
  const r5=h.slice(-RECENT).reduce((a,b)=>a+b,0), w5=SESSIONS.slice(-RECENT).reduce((a,s)=>a+s.w,0);
  const rE=h.slice(0,-RECENT).reduce((a,b)=>a+b,0), wE=SESSIONS.slice(0,-RECENT).reduce((a,s)=>a+s.w,0);
  const total=r5+rE, rate5=r5/w5*1000, rateE=rE/wE*1000;
  let trend;
  if(r5===0) trend='quiet'; else if(r5>=3&&(rE===0||rate5>=rateE*1.5)) trend='rising'; else if(rE>0&&rate5<=rateE*0.5) trend='fading'; else trend='steady';
  return {h,rate,r5,total,trend,last3:h.slice(-3).reduce((a,b)=>a+b,0)};
}
const TREND_LABEL={rising:'Rising',steady:'Steady',fading:'Fading',quiet:'Quiet (unproven)'};

// ---------- quiz state ----------
function st(k){return memState[k]||(memState[k]={k,box:0,due:null,reviews:0,history:[],seen:[]});}
function quizStrength(k){
  const s=memState[k]; if(!s||!s.history.length) return {cls:'none',label:'Not quizzed',n:0,acc:null};
  const last=s.history.slice(-6); const sc=last.reduce((a,h)=>a+(h.ok?(h.hint?0.5:1):0),0)/last.length;
  if(last.length<3) return {cls:'none',label:'Too few ('+last.length+')',n:last.length,acc:sc};
  return sc>=0.75?{cls:'strong',label:'Strong '+Math.round(sc*100)+'%',n:last.length,acc:sc}:{cls:'weak',label:'Weak '+Math.round(sc*100)+'%',n:last.length,acc:sc};
}
function isDue(k){const s=memState[k];return !!(s&&s.due&&s.due<=todayStr());}
function lastMiss(k){const s=memState[k];return !!(s&&s.history.length&&!s.history[s.history.length-1].ok);}

function queueWrite(path,data){
  lsSet('ppq_state',memState);
  if(!db) return;
  const prev=writeChains[path]||Promise.resolve();
  writeChains[path]=prev.then(()=>db.doc(path).set(data)).catch(e=>{showBanner('A result could not be saved ('+(e&&e.code||'error')+'). It is kept in this browser for now.');});
}

// ---------- session building ----------
function pickItem(p,want,used){
  const s=st(p.k); const avail=p.items.filter(it=>!used.has(it.i)); if(!avail.length) return null;
  let kind=want?avail.filter(it=>it.s===want):avail; if(!kind.length) kind=avail;
  if(want==='n'){const pairs=kind.filter(it=>it.c); if(pairs.length&&Math.random()<0.5) kind=pairs;}
  const fresh=kind.filter(it=>!s.seen.includes(it.i)); const src=fresh.length?fresh:kind;
  return src[Math.floor(Math.random()*src.length)];
}
function chooseFmt(p,it){
  if(it.x) return 'fix';
  if(it.c) return 'pair';
  const acc=answers(it).map(norm);
  const wrong=(it.w||p.wrong).filter(w=>!acc.includes(norm(w===ZERO?'':w)));
  return (wrong.length&&Math.random()<0.3)?'mc':'fill';
}
function autoPlan(size,vn){
  const cands=BANK.filter(p=>isCore(p)&&(vn||p.sec==='prep')).map(p=>{
    const sp=speech(p.k), due=isDue(p.k), miss=lastMiss(p.k), tested=!!(memState[p.k]&&memState[p.k].history.length);
    let score=3*sp.r5+(due?4:0)+(miss?3:0); const why=[];
    if(sp.r5) why.push(sp.r5+'× in your last '+RECENT+' sessions');
    if(due) why.push('due for review'); if(miss) why.push('missed last time');
    if(!tested&&sp.r5===0) score+=0.2;
    return {p,score,why,quiet:sp.r5===0&&sp.total>=4,quota:(sp.r5>=3||miss)?2:1};
  });
  const main=cands.filter(c=>c.score>=1).sort((a,b)=>b.score-a.score||Math.random()-0.5);
  const quiet=shuffle(cands.filter(c=>c.quiet&&!isDue(c.p.k)&&c.score<1)).slice(0,size>=12?2:(size>=6?1:0));
  quiet.forEach(c=>c.why=['quiet check: not heard in '+RECENT+' sessions']);
  const slots=size-quiet.length; const alloc=new Map();
  let used=0;
  for(const c of main){if(used>=slots)break;const n=Math.min(c.quota,slots-used);alloc.set(c,n);used+=n;}
  for(let pass=0;pass<3&&used<slots;pass++){for(const c of main){if(used>=slots)break;const cur=alloc.get(c)||0;if(cur<3&&cur<c.p.items.length){alloc.set(c,cur+1);used++;}}}
  if(used<slots){for(const c of shuffle(cands)){if(used>=slots)break;if(!alloc.has(c)&&!quiet.includes(c)){alloc.set(c,1);used++;if(!c.why.length)c.why=['extra practice'];}}}
  quiet.forEach(c=>alloc.set(c,1));
  return alloc;
}
function manualPlan(size,keys){
  const ps=keys.map(k=>P[k]); const alloc=new Map(ps.map(p=>[{p,why:['your pick']},0]));
  let used=0,guard=0; const entries=[...alloc.keys()];
  while(used<size&&guard<500&&entries.length){const c=entries[guard%entries.length];guard++;const cur=alloc.get(c);if(cur<c.p.items.length){alloc.set(c,cur+1);used++;}}
  return alloc;
}
function buildSession(alloc,mode,size,tab){
  tab=tab||'core';
  const items=[]; const cnt={y:0,n:0};
  for(const [c,n] of alloc){
    const used=new Set(); const s=st(c.p.k);
    for(let j=0;j<n;j++){
      const mix=typeof prefs.mix==='number'?prefs.mix:0.5; const want=tab==='adv'?null:(cnt.y<mix*(cnt.y+cnt.n+1)?'y':'n');
      const it=pickItem(c.p,want,used); if(!it) break;
      used.add(it.i); cnt[it.s]++; s.seen=[it.i].concat(s.seen.filter(x=>x!==it.i)).slice(0,Math.max(1,Math.min(6,c.p.items.length-2)));
      items.push({p:c.p,it,fmt:chooseFmt(c.p,it),why:c.why.join(' · '),hint:0,answer:null,done:false,ok:null,opts:null,dimmed:null});
    }
  }
  const sess={id:'r_'+Date.now(),tab,mode,size,started:new Date().toISOString(),items:shuffle(items),promoted:new Set()};
  sess.items.forEach(x=>{if(x.fmt==='mc'){const acc=answers(x.it).map(norm);const wrong=(x.it.w||x.p.wrong).filter(w=>!acc.includes(norm(w===ZERO?'':w)));x.opts=shuffle([x.it.a.split('|')[0]].concat(shuffle(wrong).slice(0,3)));}});
  return sess;
}

// ---------- recording ----------
function record(x){
  const k=x.p.k, s=st(k), today=todayStr();
  x.prev={box:s.box,due:s.due};
  s.reviews++; s.history.push({t:new Date().toISOString(),ok:x.ok,hint:x.hint,fmt:x.fmt,item:x.it.i,src:x.it.s,gaveUp:!!x.gaveUp});
  if(s.history.length>40) s.history=s.history.slice(-40);
  if(!x.ok){s.box=0;s.due=addDays(1);session.promoted.delete(k);session.missed=session.missed||new Set();session.missed.add(k);}
  else if(x.hint===0&&!session.promoted.has(k)&&!(session.missed&&session.missed.has(k))){s.box=Math.min(s.box+1,INTERVALS.length-1);s.due=addDays(INTERVALS[s.box]);session.promoted.add(k);}
  else if(!s.due){s.due=addDays(Math.max(1,INTERVALS[s.box]));}
  s.last=today;
  queueWrite('patterns/'+k,{k,box:s.box,due:s.due,reviews:s.reviews,last:s.last,history:s.history,seen:s.seen,label:x.p.label,sec:x.p.sec});
  const done=session.items.filter(y=>y.done);
  queueWrite('runs/'+session.id,{tab:session.tab||'core',mode:session.mode,size:session.items.length,started:session.started,updated:new Date().toISOString(),kind:'review',
    answered:done.length,correct:done.filter(y=>y.ok).length,hinted:done.filter(y=>y.hint>0).length,
    items:done.map(y=>({p:y.p.k,item:y.it.i,src:y.it.s,fmt:y.fmt,ok:y.ok,hint:y.hint,gaveUp:!!y.gaveUp}))});
}

function leastPractised(){

  const keys=[],groups=[];
  for(const x of fams){if(keys.length>=8)break;groups.push(x.f.label);x.ks.slice().sort((a,b)=>((memState[a]&&memState[a].reviews)||0)-((memState[b]&&memState[b].reviews)||0)).forEach(k=>keys.push(k));}
  return {keys,groups};

function autoPlanAdv(size){

    const why=[]; let score=Math.random()*0.5+3*sp.r5;
    if(sp.r5) why.push(sp.r5+'× in your last '+RECENT+' sessions'); if(due){score+=4;why.push('due for review');} if(miss){score+=3;why.push('missed last time');} if(!tested){score+=2;why.push('not practised yet');}
    if(!why.length) why.push('extra practice');
    return {p,score,why,quota:miss?2:1};}).sort((a,b)=>b.score-a.score);
  const alloc=new Map(); let used=0;
  for(const c of cands){if(used>=size)break;const n=Math.min(c.quota,size-used);alloc.set(c,n);used+=n;}
  for(let pass=0;pass<3&&used<size;pass++){for(const c of cands){if(used>=size)break;const cur=alloc.get(c)||0;if(cur<c.p.items.length&&cur<3){alloc.set(c,cur+1);used++;}}}
  return alloc;

function maskHint(ans,level){

  const n=level===2?1:2;

    if(x.hint>=2)L.push('First letters: A '+(A[0]===''?'(nothing?)':maskHint(A[0],2))+' · B '+(A[1]===''?'(nothing?)':maskHint(A[1],2)));

function check(x,i,zero){

      const raw=[ea?ea.value:'',eb?eb.value:''];
      if(!raw[0].trim()&&!raw[1].trim()){x.gaveUp=true;x.ok=false;x.answer=null;x.pairOk=[false,false];}
      else{const v=raw.map(r=>r.trim()===ZERO?'':r);const A1=answers(x.it).map(norm),A2=x.it.a2.split('|').map(a=>a===ZERO?'':a).map(norm);

const SPEECH_CEIL=1.0, W_SPEECH=0.7, MIN_SLIPS=3;
function chipSpeech(keys){const h=new Array(N_S).fill(0);keys.forEach(k=>(HITS[k]||[]).forEach((c,i)=>h[i]+=c));const total=h.reduce((a,b)=>a+b,0);
  const r5=h.slice(-RECENT).reduce((a,b)=>a+b,0), w5=SESSIONS.slice(-RECENT).reduce((a,x)=>a+x.w,0), rate=r5/w5*1000;
  if(total<MIN_SLIPS) return {thin:true,total}; return {score:Math.max(0,1-rate/SPEECH_CEIL),r5,rate,total,quiet:r5===0};}
function chipQuiz(keys){let hs=[];keys.forEach(k=>{const s=memState[k];if(s)hs=hs.concat(s.history||[]);});if(!hs.length)return null;hs.sort((a,b)=>a.t<b.t?-1:1);const last=hs.slice(-10);
  return {score:last.reduce((a,h)=>a+(h.ok?(h.hint?0.5:1):0),0)/last.length,n:last.length,all:hs.length};}
function chipScore(keys,metric){const sp0=chipSpeech(keys),sp=sp0&&!sp0.thin?sp0:null,q=chipQuiz(keys);
  const thin=sp0&&sp0.thin?(sp0.total||0):(sp0?0:0); const T=(o)=>Object.assign(o,{thin:sp0&&sp0.thin?sp0.total:null});
  if(metric==='speech') return T(sp?{v:sp.score,sp,q,note:sp.quiet?'quiet':''}:{v:null,sp,q});
  if(metric==='quiz') return T(q?{v:q.score,sp,q}:{v:null,sp,q});
  if(sp&&q) return T({v:W_SPEECH*sp.score+(1-W_SPEECH)*q.score,sp,q});
  if(sp) return T({v:sp.score,sp,q,note:'speaking only'}); if(q) return T({v:q.score,sp,q,note:'quiz only'}); return T({v:null,sp,q});}
function scoreColor(v){const stops=[[0,[168,64,47]],[0.5,[168,113,0]],[0.75,[111,138,18]],[1,[47,143,78]]];
  for(let i=1;i<stops.length;i++){if(v<=stops[i][0]){const[a0,c0]=stops[i-1],[a1,c1]=stops[i];const t=(v-a0)/(a1-a0);return 'rgb('+c0.map((c,j)=>Math.round(c+(c1[j]-c)*t)).join(',')+')';}}return 'rgb(47,143,78)';}
function chipTip(label,r,metric){const parts=[label];
  if(r.thin) parts.push('Speaking: only '+r.thin+' slip'+(r.thin===1?'':'s')+' on record (needs '+MIN_SLIPS+'), so no score yet');
  else if(r.sp) parts.push('Speaking: '+Math.round(r.sp.score*100)+'% · '+r.sp.r5+' slip'+(r.sp.r5===1?'':'s')+' in last '+RECENT+' sessions ('+r.sp.rate.toFixed(2)+' per 1,000 words)'+(r.sp.quiet?' · quiet, not proof':''));
  else parts.push('Speaking: no slips ever recorded, so no score');
  parts.push(r.q?'Quiz: '+Math.round(r.q.score*100)+'% over the last '+r.q.n+' answers':'Quiz: not practised yet');
  if(metric==='combined'&&r.v!=null) parts.push(r.note?'Combined uses '+r.note:'Combined: 70% speaking + 30% quiz');
  return parts.join('\n');}

      const tip=chipTip(label,r,hmMetric); c.setAttribute('aria-label',tip.replace(/\n/g,'. ')); c.title=tip;
      c.onmouseenter=c.onfocus=e=>hmTip(e,tip); c.onmouseleave=c.onblur=e=>hmTip(e,null); c.onclick=e=>hmTip(e,tip);
      cloud.appendChild(c);});

  const lg=el('div','hm-legend'); lg.appendChild(el('span',null,'0%')); lg.appendChild(el('span','scale-bar')); lg.appendChild(el('span',null,'100%'));
  const n=el('span','sw none'); lg.appendChild(n); lg.appendChild(el('span',null,'no data')); card.appendChild(lg);
  const notes={speech:'Speaking % = 100 minus your slips per 1,000 words in the last '+RECENT+' sessions × 100 (1 slip per 1,000 words or more = 0%). A preposition stays grey until it has at least '+MIN_SLIPS+' slips on record, so rarely used ones don’t look strong by accident. The ledger records slips only, so this is a stand-in, not a true accuracy. “·q” = quiet: no slips lately, which is not proof yet. Data as of '+AS_OF+'.',
    quiz:'Quiz % = your last 10 answers for that preposition; a correct answer after a hint counts as half.',
    combined:'Combined = 70% speaking + 30% quiz. Where one side is missing, the chip shows the other side alone: “·s” = speaking only, “·z” = quiz only.'};
  card.appendChild(el('div','legend',notes[hmMetric]));
  return card;
}

  if(noSpeech.length){const u=el('div','legend');u.textContent='Challenge patterns with no speaking data ('+noSpeech.map(p=>p.label+': '+quizStrength(p.k).label).join(', ')+') stay out of the grid, because there is no speech side to compare.';card.appendChild(u);}

  root.appendChild(card);
  const t=el('div','card'); const th=el('div','ex-head'); th.appendChild(el('h2',null,'Pattern groups')); th.appendChild(el('span','type-pill','hits per 1,000 words')); t.appendChild(th);

(function boot(){
  const ls=lsGet('ppq_state'); if(ls&&typeof ls==='object') memState=ls;
  const lp=lsGet('ppq_prefs'); if(lp&&typeof lp==='object') prefs=Object.assign(prefs,lp);
  sessions.core=restoreSession('core'); sessions.adv=restoreSession('adv'); if(sessions.adv&&!sessions.core) view='challenge';
  window.addEventListener('error',e=>showBanner('Something went wrong on the page ('+(e.message||'error')+'). Please tell Claude.'));
  render();
  const c=window.claude;
  if(!c||!c.use){showBanner('Quiz memory is not available in this view. Results are kept in this browser only.');return;}
  c.use('db').then(async d=>{
    if(!d){showBanner('Quiz memory is not available in this view. Results are kept in this browser only.');return;}
    db=d;
    try{
      const snap=await db.collection('patterns').get(); const fromDb={};
      snap.docs.forEach(doc=>{const v=doc.data();if(v&&v.k){const c=JSON.parse(JSON.stringify(v));c.seen=Array.isArray(c.seen)?c.seen:[];c.history=Array.isArray(c.history)?c.history:[];fromDb[c.k]=c;}});
      Object.keys(fromDb).forEach(k=>{const loc=memState[k];if(!loc||(fromDb[k].reviews||0)>=(loc.reviews||0))memState[k]=fromDb[k];});
      const pd=await db.doc('settings/prefs').get(); if(pd.exists) prefs=Object.assign({},prefs,JSON.parse(JSON.stringify(pd.data()||{})));
      showBanner(''); if(!session) render();
    }catch(e){showBanner('Could not load the quiz memory ('+(e&&e.code||'error')+'). Results are kept in this browser for now.');}
  });
})();
